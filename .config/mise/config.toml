[settings]
dotfiles.root = "~/.dotfiles"
dotfiles.default_mode = "symlink"

[bootstrap.packages]
"pacman:ttf-firacode-nerd" = "latest"
"pacman:ttf-jetbrains-mono-nerd" = "latest"
"pacman:ghostty" = "latest"
"pacman:starship" = "latest"
"pacman:jp2a" = "latest"
"pacman:tree" = "latest"
"pacman:lazygit" = "latest"
"pacman:lazydocker" = "latest"
"pacman:podman" = "latest"
"pacman:docker-compose" = "latest"

