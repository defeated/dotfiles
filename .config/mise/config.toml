"~/.config/niri/cfg/display.kdl" = {}
"~/.config/niri/cfg/input.kdl" = {}
"~/.config/niri/cfg/keybinds.kdl" = {}
"~/.config/niri/cfg/layout.kdl" = {}
"~/.config/niri/cfg/misc.kdl" = {}
